name: Actualizar dashboard desde Excel

on:
  push:
    paths:
      - 'data/*.xlsx'
  workflow_dispatch: {}  # permite correrlo manualmente desde la pestaña "Actions" si hace falta

permissions:
  contents: write  # necesario para que el robot pueda hacer commit del index.html actualizado

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar librería para leer Excel
        run: npm install xlsx@0.18.5 --no-save

      - name: Procesar Bitácora y actualizar index.html
        run: node scripts/build-dashboard.js

      - name: Publicar el cambio (commit automático)
        run: |
          git config user.name "docexpo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --quiet --cached || git commit -m "Actualización automática de datos desde data/bitacora.xlsx"
          git push
